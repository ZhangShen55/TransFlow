name: transflow

services:
  vllm:
    image: vllm/vllm-openai:v0.28.0
    command:
      - /model
      - --served-model-name
      - Hz-MT2
      - --trust-remote-code
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.50}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-512}
      - --generation-config
      - vllm
      - --enable-request-id-headers
      - --api-key
      - ${VLLM_API_KEY:-local}
    volumes:
      - ${TRANSFLOW_MODEL_PATH:-../model/Hz-MT2}:/model:ro
    expose:
      - "8000"
    ipc: host
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TRANSFLOW_GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    networks:
      - inference

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      TRANSFLOW_INFERENCE__BASE_URLS: '["http://vllm:8000/v1"]'
      TRANSFLOW_INFERENCE__API_KEY: ${VLLM_API_KEY:-local}
      TRANSFLOW_INFERENCE__BATCH_WORKERS: ${TRANSFLOW_BATCH_WORKERS:-16}
      TRANSFLOW_INFERENCE__MAX_CONNECTIONS: ${TRANSFLOW_MAX_CONNECTIONS:-16}
      TRANSFLOW_LOGGING__LEVEL: ${TRANSFLOW_LOG_LEVEL:-INFO}
      TRANSFLOW_SCHEDULER__DISPATCH_CHUNK_SIZE: ${TRANSFLOW_DISPATCH_CHUNK_SIZE:-60}
      TRANSFLOW_SCHEDULER__MAX_INFLIGHT_SEQUENCES: ${TRANSFLOW_MAX_INFLIGHT_SEQUENCES:-512}
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${TRANSFLOW_API_BIND:-0.0.0.0}:${TRANSFLOW_API_PORT:-8000}:8000"
    volumes:
      # 使用宿主机配置，修改 config.toml 后重建容器即可生效。
      - ../config.toml:/app/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped
    networks:
      - edge
      - inference

networks:
  # 不设置 external：网络存在时复用，不存在时由 Compose 创建。
  edge:
    name: transflow_edge
  inference:
    name: transflow_inference
    internal: true
